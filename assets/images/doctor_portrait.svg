<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="docBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="glowDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="50%" stop-color="#0b1c31"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="portraitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="24" fill="url(#docBg)"/>
  
  <!-- Ambient Surgical Lighting Ring -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" stroke-dasharray="8,6"/>
  <circle cx="300" cy="270" r="210" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>

  <!-- Subtle Surgical Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
  </g>

  <!-- Doctor Silhouette & Scrub Art -->
  <g filter="url(#portraitGlow)">
    <!-- Shoulders & Surgical Coat / Scrubs -->
    <path d="M 120 750 C 130 570 170 510 240 480 L 270 470 L 300 520 L 330 470 L 360 480 C 430 510 470 570 480 750 Z" fill="url(#scrubGrad)"/>
    
    <!-- Scrub Collar V-Neck -->
    <path d="M 260 470 L 300 535 L 340 470 Z" fill="#0369a1"/>
    
    <!-- Neck -->
    <rect x="272" y="380" width="56" height="100" rx="12" fill="url(#skinGrad)"/>
    
    <!-- Head & Face -->
    <ellipse cx="300" cy="300" rx="72" ry="94" fill="url(#skinGrad)"/>
    
    <!-- Hair (Distinguished Dark Slate / Trimmed) -->
    <path d="M 226 290 C 220 220 250 190 300 190 C 350 190 380 220 374 290 C 360 250 340 240 300 240 C 260 240 240 250 226 290 Z" fill="#1e293b"/>
    <path d="M 228 290 C 224 230 255 200 300 200 C 345 200 376 230 372 290 C 365 260 345 248 300 248 C 255 248 235 260 228 290 Z" fill="#0f172a"/>

    <!-- Subtle Facial Features (Minimalist Sophistication) -->
    <!-- Eyebrows -->
    <path d="M 252 272 Q 272 268 288 274" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 312 274 Q 328 268 348 272" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="270" cy="286" rx="7" ry="5" fill="#1e293b"/>
    <circle cx="272" cy="284" r="2" fill="#ffffff"/>
    <ellipse cx="330" cy="286" rx="7" ry="5" fill="#1e293b"/>
    <circle cx="332" cy="284" r="2" fill="#ffffff"/>
    <!-- Nose -->
    <path d="M 300 286 L 298 322 L 306 324" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    <!-- Confident Professional Smile -->
    <path d="M 276 345 Q 300 362 324 345" stroke="#be123c" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- High-Precision Surgical Loupe Headlamp (Iconic Specialist Emblem) -->
    <rect x="250" y="222" width="100" height="10" rx="4" fill="#334155"/>
    <rect x="286" y="210" width="28" height="20" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="300" cy="220" r="7" fill="#38bdf8"/>
    <circle cx="300" cy="220" r="3" fill="#ffffff"/>
    
    <!-- Medical Stethoscope around neck -->
    <path d="M 250 480 C 235 550 250 630 280 650 L 300 660" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 350 480 C 365 550 350 630 320 650 L 300 660" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="300" cy="668" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Verified Specialist Credential Badge Overlay -->
  <g transform="translate(40, 640)">
    <rect width="240" height="66" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" filter="url(#portraitGlow)"/>
    <circle cx="34" cy="33" r="16" fill="#0369a1"/>
    <!-- Checkmark -->
    <path d="M 26 33 L 31 38 L 42 27" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="28" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">FACS Board Certified</text>
    <text x="60" y="47" fill="#94a3b8" font-family="system-ui" font-size="11">Oral &amp; Maxillofacial Surgery</text>
  </g>
</svg>
