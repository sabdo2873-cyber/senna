<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1b"/>
      <stop offset="60%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lightBeam" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#suiteBg)"/>

  <!-- Architectural Windows with Manhattan Skyline Silhouette -->
  <g opacity="0.3">
    <rect x="50" y="40" width="180" height="260" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="250" y="40" width="180" height="260" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="450" y="40" width="180" height="260" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- City glow buildings -->
    <path d="M 60 300 L 60 200 L 90 200 L 90 170 L 120 170 L 120 230 L 150 230 L 150 190 L 190 190 L 190 300 Z" fill="#1e293b" opacity="0.4"/>
    <path d="M 260 300 L 260 180 L 300 180 L 300 150 L 330 150 L 330 220 L 370 220 L 370 300 Z" fill="#1e293b" opacity="0.4"/>
  </g>

  <!-- Surgical Overhead Operating Lamp Beam -->
  <polygon points="400,30 240,430 560,430" fill="url(#lightBeam)"/>
  
  <!-- Surgical Lamp Arm & Head -->
  <g stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 520 10 L 460 50 L 400 30"/>
  </g>
  <ellipse cx="400" cy="30" rx="46" ry="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="400" cy="32" rx="34" ry="8" fill="#e0f2fe"/>

  <!-- High-Tech 3D Dual Monitor Arm (Showing CBCT & Dental Scan) -->
  <g transform="translate(120, 140)">
    <rect width="130" height="85" rx="6" fill="#090e1a" stroke="#38bdf8" stroke-width="2"/>
    <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="9">3D CBCT VOXEL MAP</text>
    <!-- Virtual Dental Arch Scan -->
    <path d="M 25 65 Q 65 35 105 65" stroke="#06b6d4" stroke-width="3" fill="none"/>
    <circle cx="65" cy="46" r="4" fill="#22c55e"/>
    <circle cx="45" cy="53" r="3" fill="#38bdf8"/>
    <circle cx="85" cy="53" r="3" fill="#38bdf8"/>
    <!-- Articulating mount -->
    <path d="M 65 85 L 65 140 L 40 180" stroke="#475569" stroke-width="4" fill="none"/>
  </g>

  <!-- Ergonomic Surgical Operatory Bed / Chair -->
  <g transform="translate(290, 240)">
    <!-- Base Column -->
    <rect x="85" y="120" width="50" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <ellipse cx="110" cy="190" rx="70" ry="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Chair Contour Cushion -->
    <!-- Headrest -->
    <rect x="20" y="10" width="40" height="24" rx="8" fill="url(#chairGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Backrest (Reclined 35 deg) -->
    <path d="M 50 20 L 110 50 L 100 80 L 40 50 Z" fill="url(#chairGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Seat -->
    <path d="M 100 80 L 170 85 L 165 105 L 95 100 Z" fill="url(#chairGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Leg Support -->
    <path d="M 165 90 L 220 130 L 210 145 L 155 105 Z" fill="url(#chairGrad)" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Clean Floor Reflection & Horizon Line -->
  <line x1="0" y1="430" x2="800" y2="430" stroke="#1e293b" stroke-width="2"/>

  <!-- Info Badge -->
  <rect x="30" y="420" width="310" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <text x="45" y="442" fill="#94a3b8" font-family="system-ui" font-size="11">CLASS-A OPERATORY • SURGICAL NAVIGATION SUITE</text>
</svg>
