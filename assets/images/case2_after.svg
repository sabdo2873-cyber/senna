<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#19233c"/>
    </linearGradient>
    <radialGradient id="mouth2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1015"/>
      <stop offset="100%" stop-color="#0a0507"/>
    </radialGradient>
    <linearGradient id="veneerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gumHealthy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="0" y1="250" x2="800" y2="250"/>
  </g>

  <!-- Smile Mouth Void -->
  <path d="M 170 248 Q 400 130 630 248 Q 400 395 170 248 Z" fill="url(#mouth2)" filter="url(#shadow2)"/>

  <!-- Symmetrical Healthy Gums -->
  <path d="M 210 232 Q 255 188 300 220 Q 350 178 400 174 Q 450 178 500 220 Q 545 188 590 232 Q 400 216 210 232 Z" fill="url(#gumHealthy)"/>

  <!-- High-Aesthetic Feldspathic Porcelain Veneers -->
  <g filter="url(#shadow2)">
    <path d="M 265 218 C 275 190 298 192 302 248 C 298 260 272 258 265 218 Z" fill="url(#veneerGrad)"/>
    <path d="M 308 210 C 320 182 342 184 345 258 C 340 268 314 266 308 210 Z" fill="url(#veneerGrad)"/>
    <!-- Central 1 (Golden proportion, immaculate straight edge, natural luster) -->
    <path d="M 350 200 C 362 172 396 172 396 270 C 390 278 356 278 350 200 Z" fill="url(#veneerGrad)"/>
    <!-- Central 2 -->
    <path d="M 402 200 C 414 172 448 172 446 270 C 440 278 408 278 402 200 Z" fill="url(#veneerGrad)"/>
    <path d="M 452 210 C 464 182 486 184 488 258 C 482 268 458 266 452 210 Z" fill="url(#veneerGrad)"/>
    <path d="M 495 218 C 505 190 528 192 528 248 C 522 260 498 258 495 218 Z" fill="url(#veneerGrad)"/>
  </g>

  <!-- Incisal light shine line -->
  <line x1="354" y1="267" x2="392" y2="267" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="406" y1="267" x2="442" y2="267" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Post-Op Status Badge -->
  <rect x="24" y="24" width="144" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="5" fill="#10b981"/>
  <text x="56" y="46" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="700" letter-spacing="1">POST-OP</text>

  <text x="770" y="470" text-anchor="end" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">CASE #02 • 10-UNIT MICRO-THIN CERAMIC VENEERS</text>
</svg>
